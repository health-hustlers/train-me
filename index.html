<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>منصة التدريب</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<!-- Supabase يتحمل أخيراً وبعدين يشغّل الـ app -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #0f172a;
  --ink-soft: #475569;
  --ink-faint: #94a3b8;
  --surface: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --trainer: #7c3aed;
  --trainer-light: #ede9fe;
  --trainee: #0ea5e9;
  --trainee-light: #e0f2fe;
  --success: #10b981;
  --success-light: #f0fdf4;
  --danger: #ef4444;
  --danger-light: #fff1f2;
  --warning: #f59e0b;
  --radius: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}

body {
  font-family: 'Cairo', sans-serif;
  background: var(--surface);
  color: var(--ink);
  min-height: 100vh;
}

#root { min-height: 100vh; }

/* ── NAV ── */
.nav {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.nav-logo {
  font-weight: 800;
  font-size: 1.2rem;
  color: var(--trainer);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.nav-logo span { font-size: 1.4rem; }
.nav-actions { display: flex; gap: 10px; align-items: center; }
.nav-user {
  font-size: .82rem;
  color: var(--ink-soft);
  background: var(--surface);
  padding: 5px 13px;
  border-radius: 30px;
  border: 1px solid var(--border);
  font-weight: 600;
}

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  font-size: .9rem;
  cursor: pointer;
  transition: all .18s ease;
  text-decoration: none;
  white-space: nowrap;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--trainer); color: #fff; }
.btn-primary:hover:not(:disabled) {
  background: #6d28d9;
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(124,58,237,.3);
}
.btn-blue { background: var(--trainee); color: #fff; }
.btn-blue:hover:not(:disabled) {
  background: #0284c7;
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(14,165,233,.3);
}
.btn-ghost {
  background: transparent;
  color: var(--ink-soft);
  border: 1.5px solid var(--border);
}
.btn-ghost:hover:not(:disabled) { background: var(--surface); color: var(--ink); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #dc2626; }
.btn-outline-danger {
  background: transparent;
  color: var(--danger);
  border: 1.5px solid #fecdd3;
}
.btn-outline-danger:hover:not(:disabled) { background: var(--danger-light); }
.btn-sm { padding: 7px 14px; font-size: .82rem; border-radius: 8px; }
.btn-block { width: 100%; justify-content: center; }

/* ── LANDING ── */
.landing {
  min-height: calc(100vh - 64px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
}
.landing-badge {
  background: var(--trainer-light);
  color: var(--trainer);
  font-size: .8rem;
  font-weight: 700;
  padding: 5px 16px;
  border-radius: 30px;
  margin-bottom: 20px;
  display: inline-block;
}
.landing h1 {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 800;
  line-height: 1.25;
  margin-bottom: 16px;
}
.landing h1 em { font-style: normal; color: var(--trainer); }
.landing > p {
  color: var(--ink-soft);
  font-size: 1.05rem;
  max-width: 500px;
  margin: 0 auto 40px;
  line-height: 1.8;
}
.role-cards {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}
.role-card {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 30px 24px;
  width: 230px;
  cursor: pointer;
  transition: all .2s ease;
  text-align: center;
}
.role-card:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-4px);
}
.role-card.trainer:hover { border-color: var(--trainer); }
.role-card.trainee:hover { border-color: var(--trainee); }
.role-icon { font-size: 2.8rem; margin-bottom: 12px; }
.role-card h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }
.role-card > p { font-size: .83rem; color: var(--ink-soft); line-height: 1.6; margin-bottom: 20px; }
.role-btns { display: flex; flex-direction: column; gap: 8px; }

/* ── AUTH ── */
.auth-wrap {
  min-height: calc(100vh - 64px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.auth-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 40px;
  width: 100%;
  max-width: 440px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}
.auth-header { text-align: center; margin-bottom: 26px; }
.auth-role-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 30px;
  font-size: .78rem;
  font-weight: 700;
  margin-bottom: 10px;
}
.auth-role-badge.trainer { background: var(--trainer-light); color: var(--trainer); }
.auth-role-badge.trainee { background: var(--trainee-light); color: var(--trainee); }
.auth-header h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; }
.auth-header p { color: var(--ink-soft); font-size: .88rem; }

/* ── FORM ── */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-weight: 600;
  font-size: .86rem;
  margin-bottom: 6px;
  color: var(--ink);
}
.form-input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'Cairo', sans-serif;
  font-size: .9rem;
  background: var(--surface);
  color: var(--ink);
  transition: border-color .15s;
  outline: none;
}
.form-input:focus { border-color: var(--trainer); background: #fff; }
.form-input.trainee:focus { border-color: var(--trainee); }
textarea.form-input { resize: vertical; min-height: 88px; }

.auth-switch {
  text-align: center;
  margin-top: 18px;
  font-size: .86rem;
  color: var(--ink-soft);
}
.auth-switch button {
  background: none;
  border: none;
  color: var(--trainer);
  font-weight: 700;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
}

/* ── ALERTS ── */
.alert {
  border-radius: 9px;
  padding: 10px 14px;
  font-size: .86rem;
  margin-bottom: 16px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.alert-error { background: var(--danger-light); color: var(--danger); border: 1px solid #fecdd3; }
.alert-success { background: var(--success-light); color: var(--success); border: 1px solid #bbf7d0; }
.alert-warning { background: #fffbeb; color: var(--warning); border: 1px solid #fed7aa; }

/* ── DASHBOARD ── */
.dashboard { max-width: 960px; margin: 0 auto; padding: 36px 20px; }
.dashboard-header { margin-bottom: 30px; }
.dashboard-header h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; }
.dashboard-header p { color: var(--ink-soft); font-size: .92rem; }

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  background: var(--surface);
  padding: 4px;
  border-radius: 12px;
  width: fit-content;
  border: 1px solid var(--border);
}
.tab {
  padding: 8px 18px;
  border-radius: 9px;
  border: none;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  font-size: .86rem;
  cursor: pointer;
  transition: all .15s;
  color: var(--ink-soft);
  background: transparent;
}
.tab.active {
  background: var(--card);
  color: var(--trainer);
  box-shadow: var(--shadow);
}

/* ── ADD FORM ── */
.add-form {
  background: var(--card);
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 28px;
}
.add-form h3 { font-weight: 700; margin-bottom: 18px; }

/* ── CARDS GRID ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.intern-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: all .2s;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.intern-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0; left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--trainer), var(--trainee));
}
.intern-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.intern-field {
  display: inline-block;
  background: var(--trainer-light);
  color: var(--trainer);
  font-size: .78rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
}
.intern-card h4 { font-size: .97rem; font-weight: 700; }
.intern-desc { font-size: .84rem; color: var(--ink-soft); line-height: 1.6; flex: 1; }
.intern-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: .78rem;
  color: var(--ink-faint);
  padding-top: 8px;
  border-top: 1px solid var(--border);
  margin-top: auto;
}

/* ── APPLICANT ROW ── */
.applicant-row {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.applicant-info { display: flex; flex-direction: column; gap: 2px; }
.applicant-name { font-weight: 700; font-size: .95rem; }
.applicant-meta { font-size: .8rem; color: var(--ink-soft); }

/* ── MODAL / OVERLAY ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 20px;
  backdrop-filter: blur(3px);
}
.modal {
  background: var(--card);
  border-radius: var(--radius);
  padding: 32px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-lg);
  animation: pop .18s ease;
}
@keyframes pop {
  from { transform: scale(.94); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.modal-header h3 { font-size: 1.15rem; font-weight: 800; }
.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  color: var(--ink-soft);
  line-height: 1;
  padding: 4px;
  border-radius: 6px;
}
.modal-close:hover { background: var(--surface); color: var(--ink); }

.info-row {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.info-row:last-of-type { border-bottom: none; }
.info-icon {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  background: var(--trainer-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .95rem;
  flex-shrink: 0;
}
.info-label { font-size: .72rem; color: var(--ink-faint); margin-bottom: 2px; }
.info-value { font-size: .9rem; font-weight: 600; }

/* ── CONFIRM DIALOG ── */
.confirm-modal { max-width: 360px; text-align: center; }
.confirm-modal .confirm-icon { font-size: 2.5rem; margin-bottom: 12px; }
.confirm-modal h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; }
.confirm-modal p { color: var(--ink-soft); font-size: .88rem; line-height: 1.6; margin-bottom: 24px; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions .btn { flex: 1; justify-content: center; }

/* ── EMPTY STATE ── */
.empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
.empty-icon { font-size: 2.8rem; margin-bottom: 12px; }
.empty h4 { font-size: 1rem; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
.empty p { font-size: .86rem; line-height: 1.7; }

/* ── BADGE ── */
.applied-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--success-light);
  color: var(--success);
  border: 1px solid #bbf7d0;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: .8rem;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
}
.applied-badge:hover { background: #dcfce7; }

/* ── SPINNER ── */
.spinner {
  display: inline-block;
  width: 17px;
  height: 17px;
  border: 2.5px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── CONFIG NOTICE ── */
.config-notice {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.config-box {
  background: var(--card);
  border-radius: var(--radius);
  padding: 36px;
  max-width: 460px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  text-align: center;
}
.config-box h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; color: var(--danger); }
.config-box p { color: var(--ink-soft); font-size: .88rem; line-height: 1.8; margin-bottom: 14px; }
.config-box code {
  display: block;
  background: #f1f5f9;
  border-radius: 8px;
  padding: 10px 14px;
  font-family: monospace;
  font-size: .8rem;
  text-align: left;
  direction: ltr;
  color: var(--ink);
  border: 1px solid var(--border);
  margin-bottom: 8px;
  word-break: break-all;
}

@media (max-width: 600px) {
  .auth-card { padding: 26px 18px; }
  .role-cards { flex-direction: column; align-items: center; }
  .role-card { width: 100%; max-width: 300px; }
  .modal { padding: 24px 18px; }
  .tabs { width: 100%; }
  .tab { flex: 1; text-align: center; }
  .intern-footer { flex-direction: column; align-items: flex-start; gap: 8px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ─── SUPABASE CONFIG ──────────────────────────────────────────────────────────
// ⚠️  غيّر القيمتين دول ببيانات مشروعك من:
//     Supabase Dashboard → Settings → API
// ─────────────────────────────────────────────────────────────────────────────
const SUPABASE_URL      = 'https://mcqugbvpiyrmqsndtiwu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jcXVnYnZwaXlybXFzbmR0aXd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDA5NDAsImV4cCI6MjA5NjY3Njk0MH0.aspyIGCB_nzvAV2Si_fRrswKP31w10hLDDjlA6K2dxE';

const CONFIG_MISSING = !SUPABASE_URL || !SUPABASE_ANON_KEY;

// نتأكد إن window.supabase اتحمل صح قبل ما نعمل client
let supabase = null;
if (!CONFIG_MISSING) {
  const _sb = window.supabase ?? window.Supabase ?? window.SupabaseJs;
  if (_sb && typeof _sb.createClient === 'function') {
    supabase = _sb.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } else {
    console.error('Supabase SDK لم يتحمل. تأكد من اتصالك بالإنترنت وأعد تحميل الصفحة.');
  }
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const fmt = (d) =>
  new Date(d).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });

// ─── REUSABLE: CONFIRM DIALOG ─────────────────────────────────────────────────
function ConfirmDialog({ icon = '⚠️', title, message, confirmLabel = 'تأكيد', confirmClass = 'btn-danger', onConfirm, onCancel }) {
  return (
    <div className="overlay" onClick={e => e.target.classList.contains('overlay') && onCancel()}>
      <div className="modal confirm-modal">
        <div className="confirm-icon">{icon}</div>
        <h3>{title}</h3>
        <p>{message}</p>
        <div className="confirm-actions">
          <button className="btn btn-ghost" onClick={onCancel}>إلغاء</button>
          <button className={`btn ${confirmClass}`} onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

// ─── REUSABLE: TRAINER INFO MODAL ─────────────────────────────────────────────
function TrainerModal({ info, field, onClose }) {
  return (
    <div className="overlay" onClick={e => e.target.classList.contains('overlay') && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <h3>✅ تم التقديم بنجاح!</h3>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <p style={{ color: 'var(--ink-soft)', fontSize: '.86rem', marginBottom: 20, lineHeight: 1.7 }}>
          تقدمت على تدريب في مجال <strong>{field}</strong> — إليك بيانات المدرب للتواصل:
        </p>

        <div className="info-row">
          <div className="info-icon">🏢</div>
          <div>
            <div className="info-label">الشركة / المدرب</div>
            <div className="info-value">{info.company_name || info.name}</div>
          </div>
        </div>
        <div className="info-row">
          <div className="info-icon">📧</div>
          <div>
            <div className="info-label">الإيميل</div>
            <div className="info-value" style={{ direction: 'ltr' }}>{info.email}</div>
          </div>
        </div>
        <div className="info-row">
          <div className="info-icon">📞</div>
          <div>
            <div className="info-label">التليفون</div>
            <div className="info-value" style={{ direction: 'ltr' }}>{info.phone}</div>
          </div>
        </div>

        <div style={{ marginTop: 24 }}>
          <button className="btn btn-primary btn-block" onClick={onClose}>حسناً، شكراً!</button>
        </div>
      </div>
    </div>
  );
}

// ─── CONFIG NOTICE ────────────────────────────────────────────────────────────
const SDK_MISSING = !CONFIG_MISSING && !supabase;

function ConfigNotice() {
  if (SDK_MISSING) {
    return (
      <div className="config-notice">
        <div className="config-box">
          <h2>❌ خطأ في التحميل</h2>
          <p>لم يتحمل Supabase SDK بشكل صحيح.</p>
          <p>تأكد من <strong>اتصالك بالإنترنت</strong> ثم <strong>أعد تحميل الصفحة</strong>.</p>
        </div>
      </div>
    );
  }
  return (
    <div className="config-notice">
      <div className="config-box">
        <h2>⚠️ إعداد مطلوب</h2>
        <p>يرجى إدخال بيانات Supabase الخاصة بك في أعلى الكود</p>
        <code>SUPABASE_URL = 'https://xxxx.supabase.co'</code>
        <code>SUPABASE_ANON_KEY = 'eyJ...'</code>
        <p>تلاقيهم في: <strong>Supabase Dashboard → Settings → API</strong></p>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage]       = useState('landing');
  const [role, setRole]       = useState(null);
  const [authMode, setAuthMode] = useState('login');
  const [user, setUser]       = useState(null);
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    if (CONFIG_MISSING || !supabase) return;

    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) loadUser(session.user);
    });

    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      if (session) loadUser(session.user);
      else { setUser(null); setProfile(null); setPage('landing'); }
    });

    return () => subscription.unsubscribe();
  }, []);

  async function loadUser(u) {
    setUser(u);
    const { data } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', u.id)
      .single();
    if (data) { setProfile(data); setPage('dashboard'); }
  }

  async function handleLogout() {
    await supabase.auth.signOut();
    setRole(null);
    setPage('landing');
  }

  return (
    <div>
      {(CONFIG_MISSING || SDK_MISSING) && <ConfigNotice />}

      <nav className="nav">
        <div className="nav-logo" onClick={() => !user && setPage('landing')}>
          <span>🎓</span> منصة التدريب
        </div>
        <div className="nav-actions">
          {user && profile && <span className="nav-user">👋 {profile.name}</span>}
          {user
            ? <button className="btn btn-ghost btn-sm" onClick={handleLogout}>تسجيل خروج</button>
            : page !== 'landing' && (
                <button className="btn btn-ghost btn-sm" onClick={() => setPage('landing')}>← الرئيسية</button>
              )
          }
        </div>
      </nav>

      {page === 'landing' && (
        <Landing
          onSelect={(r) => { setRole(r); setAuthMode('register'); setPage('auth'); }}
          onLogin={(r)  => { setRole(r); setAuthMode('login');    setPage('auth'); }}
        />
      )}
      {page === 'auth' && (
        <AuthPage
          role={role}
          mode={authMode}
          setMode={setAuthMode}
          onBack={() => setPage('landing')}
          onSuccess={loadUser}
        />
      )}
      {page === 'dashboard' && profile && (
        profile.role === 'trainer'
          ? <TrainerDashboard profile={profile} />
          : <TraineeDashboard profile={profile} />
      )}
    </div>
  );
}

// ─── LANDING ──────────────────────────────────────────────────────────────────

    <div className="landing">
      <div className="landing-badge">🚀 ابدأ رحلتك المهنية</div>
      <h1>ابحث عن <em>تدريبك المثالي</em><br/>أو درّب الجيل القادم</h1>
      <p>منصة تربط المتدربين الطموحين بالشركات والمدربين المحترفين في مختلف المجالات</p>

      <div className="role-cards">
        <div className="role-card trainer">
          <div className="role-icon">🏢</div>
          <h3>مدرب / شركة</h3>
          <p>أضف فرص تدريبية وتواصل مع المتدربين المناسبين</p>
          <div className="role-btns">
            <button className="btn btn-primary btn-sm btn-block" onClick={() => onSelect('trainer')}>
              سجّل كمدرب
            </button>
            <button className="btn btn-ghost btn-sm btn-block" onClick={() => onLogin('trainer')}>
              دخول

          <div className="role-btns">
            <button className="btn btn-blue btn-sm btn-block" onClick={() => onSelect('trainee')}>
              سجّل كمتدرب
            </button>
            <button className="btn btn-ghost btn-sm btn-block" onClick={() => onLogin('trainee')}>

// ─── AUTH PAGE ────────────────────────────────────────────────────────────────
function AuthPage({ role, mode, setMode, onBack, onSuccess }) {
  const [form, setForm]       = useState({ name: '', phone: '', email: '', password: '', company_name: '' });
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState('');
  const isTrainer = role === 'trainer';

  const setField = (k, v) => setForm(f => ({ ...f, [k]: v }));

  async function handleSubmit() {
    if (!supabase) { setError('يرجى إعداد بيانات Supabase أولاً'); return; }
    setError('');
    setLoading(true);

    if (mode === 'register') {
      const { data, error: err } = await supabase.auth.signUp({
        email: form.email,
        password: form.password,
        options: {
          data: {
            name: form.name,
            phone: form.phone,
            role,
            company_name: form.company_name || null
          }
        }
      });
      if (err) { setError(err.message); setLoading(false); return; }
      if (data.user) onSuccess(data.user);
    } else {
      const { data, error: err } = await supabase.auth.signInWithPassword({
        email: form.email,
        password: form.password
      });
      if (err) { setError('الإيميل أو الباسورد غلط'); setLoading(false); return; }
      if (data.user) onSuccess(data.user);
    }

    setLoading(false);
  }

  const inputClass = `form-input${isTrainer ? '' : ' trainee'}`;

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="auth-header">
          <span className={`auth-role-badge ${role}`}>
            {isTrainer ? '🏢 مدرب / شركة' : '👨‍💻 متدرب'}
          </span>
          <h2>{mode === 'register' ? 'إنشاء حساب' : 'تسجيل الدخول'}</h2>
          <p>{mode === 'register' ? 'أدخل بياناتك لإنشاء حسابك' : 'أهلاً بعودتك!'}</p>
        </div>

        {error && <div className="alert alert-error">⚠️ {error}</div>}

        {mode === 'register' && (
          <>
            <div className="form-group">
              <label className="form-label">
                {isTrainer ? 'الاسم / اسم المسؤول' : 'الاسم بالكامل'}
              </label>
              <input
                className={inputClass}
                placeholder="اكتب اسمك هنا"
                value={form.name}
                onChange={e => setField('name', e.target.value)}
              />
            </div>
            {isTrainer && (
              <div className="form-group">
                <label className="form-label">اسم الشركة</label>
                <input
                  className={inputClass}
                  placeholder="شركة ..."
                  value={form.company_name}
                  onChange={e => setField('company_name', e.target.value)}
                />
              </div>
            )}
            <div className="form-group">
              <label className="form-label">رقم التليفون</label>
              <input
                className={inputClass}
                type="tel"
                placeholder="01xxxxxxxxx"
                value={form.phone}
                onChange={e => setField('phone', e.target.value)}
              />
            </div>
          </>
        )}

        <div className="form-group">
          <label className="form-label">الإيميل</label>
          <input
            className={inputClass}
            type="email"
            placeholder="example@email.com"
            value={form.email}
            onChange={e => setField('email', e.target.value)}
          />
        </div>

        <div className="form-group" style={{ marginBottom: 22 }}>
          <label className="form-label">الباسورد</label>
          <input
            className={inputClass}
            type="password"
            placeholder="••••••••"
            value={form.password}
            onChange={e => setField('password', e.target.value)}
          />
        </div>

        <button
          className={`btn ${isTrainer ? 'btn-primary' : 'btn-blue'} btn-block`}
          disabled={loading || !form.email || !form.password}
          onClick={handleSubmit}
        >
          {loading
            ? <span className="spinner"/>
            : mode === 'register' ? 'إنشاء الحساب' : 'تسجيل الدخول'
          }
        </button>

        <div className="auth-switch">
          {mode === 'register'
            ? <>عندك حساب؟ <button onClick={() => setMode('login')}>سجّل دخول</button></>
            : <>مش عندك حساب؟ <button onClick={() => setMode('register')}>أنشئ حساب</button></>
          }
        </div>
        <div className="auth-switch" style={{ marginTop: 8 }}>
          <button onClick={onBack} style={{ color: 'var(--ink-soft)' }}>← رجوع للرئيسية</button>
        </div>
      </div>
    </div>
  );
}

// ─── TRAINER DASHBOARD ────────────────────────────────────────────────────────
function TrainerDashboard({ profile }) {
  const [internships, setInternships] = useState([]);
  const [applications, setApplications] = useState([]);
  const [tab, setTab]         = useState('mine');
  const [form, setForm]       = useState({ field: '', description: '' });
  const [loading, setLoading] = useState(false);
  const [fetching, setFetching] = useState(true);
  const [msg, setMsg]         = useState('');
  const [deleteTarget, setDeleteTarget] = useState(null);

  const load = useCallback(async () => {
    setFetching(true);
    const { data: interns } = await supabase
      .from('internships')
      .select('*')
      .eq('trainer_id', profile.id)
      .order('created_at', { ascending: false });

    setInternships(interns || []);
    setFetching(false);
  }, [profile.id]);

  const loadApplications = useCallback(async () => {
    if (!internships.length) return;
    const ids = internships.map(i => i.id);
    const { data } = await supabase
      .from('applications')
      .select('*, profiles!trainee_id(id, name, phone, email)')
      .in('internship_id', ids)
      .order('created_at', { ascending: false });
    setApplications(data || []);
  }, [internships]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => { if (tab === 'applicants') loadApplications(); }, [tab, loadApplications]);

  async function handleAdd() {
    if (!form.field.trim()) return;
    setLoading(true);
    const { error } = await supabase.from('internships').insert({
      trainer_id: profile.id,
      field: form.field,
      description: form.description
    });
    setLoading(false);
    if (!error) {
      setMsg('تمت الإضافة بنجاح ✅');
      setForm({ field: '', description: '' });
      load();
      setTab('mine');
      setTimeout(() => setMsg(''), 3000);
    }
  }

  async function confirmDelete() {
    await supabase.from('internships').delete().eq('id', deleteTarget);
    setDeleteTarget(null);
    load();
  }

  // internship name helper for the confirm dialog
  const deleteTargetName = deleteTarget
    ? (internships.find(i => i.id === deleteTarget)?.field || 'هذا التدريب')
    : '';

  return (
    <div className="dashboard">
      <div className="dashboard-header">
        <h2>🏢 لوحة تحكم المدرب</h2>
        <p>أهلاً {profile.name} — تقدر تضيف وتدير فرص التدريب بتاعتك من هنا</p>
      </div>

      <div className="tabs">
        <button className={`tab ${tab === 'mine' ? 'active' : ''}`} onClick={() => setTab('mine')}>
          📋 تدريباتي ({internships.length})
        </button>
        <button className={`tab ${tab === 'applicants' ? 'active' : ''}`} onClick={() => setTab('applicants')}>
          👥 المتقدمون
        </button>
        <button className={`tab ${tab === 'add' ? 'active' : ''}`} onClick={() => setTab('add')}>
          ➕ أضف تدريب
        </button>
      </div>

      {msg && <div className="alert alert-success">{msg}</div>}

      {/* ── ADD TAB ── */}
      {tab === 'add' && (
        <div className="add-form">
          <h3>➕ إضافة فرصة تدريب جديدة</h3>
          <div className="form-group">
            <label className="form-label">المجال</label>
            <input
              className="form-input"
              placeholder="مثال: تطوير ويب، تسويق رقمي، تصميم جرافيك..."
              value={form.field}
              onChange={e => setForm(f => ({ ...f, field: e.target.value }))}
            />
          </div>
          <div className="form-group">
            <label className="form-label">وصف التدريب (اختياري)</label>
            <textarea
              className="form-input"
              placeholder="اكتب تفاصيل التدريب، المدة، المتطلبات..."
              value={form.description}
              onChange={e => setForm(f => ({ ...f, description: e.target.value }))}
            />
          </div>
          <button
            className="btn btn-primary"
            disabled={loading || !form.field.trim()}
            onClick={handleAdd}
          >
            {loading ? <span className="spinner"/> : 'إضافة التدريب'}
          </button>
        </div>
      )}

      {/* ── MINE TAB ── */}
      {tab === 'mine' && (
        fetching
          ? <Loading />
          : internships.length === 0
            ? <div className="empty">
                <div className="empty-icon">📭</div>
                <h4>لا يوجد تدريبات بعد</h4>
                <p>اضغط على "أضف تدريب" لنشر أول فرصة تدريبية</p>
              </div>
            : <div className="grid">
                {internships.map(i => (
                  <div key={i.id} className="intern-card">
                    <span className="intern-field">{i.field}</span>
                    <h4>{profile.company_name || profile.name}</h4>
                    {i.description && <p className="intern-desc">{i.description}</p>}
                    <div className="intern-footer">
                      <span>{fmt(i.created_at)}</span>
                      <button
                        className="btn btn-outline-danger btn-sm"
                        onClick={() => setDeleteTarget(i.id)}
                      >
                        🗑️ حذف
                      </button>
                    </div>
                  </div>
                ))}
              </div>
      )}

      {/* ── APPLICANTS TAB ── */}
      {tab === 'applicants' && (
        fetching
          ? <Loading />
          : applications.length === 0
            ? <div className="empty">
                <div className="empty-icon">👥</div>
                <h4>لا يوجد متقدمون بعد</h4>
                <p>لما يتقدم حد على تدريباتك هتلاقيه هنا</p>
              </div>
            : <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {applications.map(app => (
                  <div key={app.id} className="applicant-row">
                    <div className="applicant-info">
                      <span className="applicant-name">
                        {app.profiles?.name || '—'}
                      </span>
                      <span className="applicant-meta">
                        📧 {app.profiles?.email} &nbsp;·&nbsp; 📞 {app.profiles?.phone}
                      </span>
                      <span className="applicant-meta" style={{ marginTop: 2 }}>
                        تقدم بتاريخ {fmt(app.created_at)}
                      </span>
                    </div>
                    <span className="intern-field" style={{ flexShrink: 0 }}>
                      {internships.find(i => i.id === app.internship_id)?.field || '—'}
                    </span>
                  </div>
                ))}
              </div>
      )}

      {/* ── DELETE CONFIRM DIALOG ── */}
      {deleteTarget && (
        <ConfirmDialog
          icon="🗑️"
          title="تأكيد الحذف"
          message={`هتحذف تدريب "${deleteTargetName}"؟ الإجراء ده مش هيتراجع.`}
          confirmLabel="نعم، احذف"
          confirmClass="btn-danger"
          onConfirm={confirmDelete}
          onCancel={() => setDeleteTarget(null)}
        />
      )}
    </div>
  );
}

// ─── TRAINEE DASHBOARD ────────────────────────────────────────────────────────
function TraineeDashboard({ profile }) {
  const [internships, setInternships] = useState([]);
  const [applied, setApplied]         = useState(new Set());
  const [selected, setSelected]       = useState(null);
  const [trainerInfo, setTrainerInfo] = useState(null);
  const [loading, setLoading]         = useState(false);
  const [fetching, setFetching]       = useState(true);
  const [tab, setTab]                 = useState('all');

  const loadAll = useCallback(async () => {
    setFetching(true);

    const { data: interns } = await supabase
      .from('internships')
      .select('*, profiles!trainer_id(id, name, company_name, phone, email)')
      .order('created_at', { ascending: false });

    const { data: apps } = await supabase
      .from('applications')
      .select('internship_id')
      .eq('trainee_id', profile.id);

    setInternships(interns || []);
    setApplied(new Set((apps || []).map(a => a.internship_id)));
    setFetching(false);
  }, [profile.id]);

  useEffect(() => { loadAll(); }, [loadAll]);

  async function handleApply(internship) {
    setLoading(internship.id);
    const { error } = await supabase.from('applications').insert({
      trainee_id: profile.id,
      internship_id: internship.id
    });
    if (!error) {
      setApplied(prev => new Set([...prev, internship.id]));
      setTrainerInfo(internship.profiles);
      setSelected(internship);
    }
    setLoading(false);
  }

  const displayList = tab === 'all' ? internships : internships.filter(i => applied.has(i.id));

  return (
    <div className="dashboard">
      <div className="dashboard-header">
        <h2>👨‍💻 استعرض فرص التدريب</h2>
        <p>أهلاً {profile.name} — ابحث عن تدريب يناسبك وقدّم في ثانية</p>
      </div>

      <div className="tabs">
        <button className={`tab ${tab === 'all' ? 'active' : ''}`} onClick={() => setTab('all')}>
          🔍 كل الفرص ({internships.length})
        </button>
        <button className={`tab ${tab === 'mine' ? 'active' : ''}`} onClick={() => setTab('mine')}>
          ✅ تقديماتي ({applied.size})
        </button>
      </div>

      {fetching
        ? <Loading />
        : displayList.length === 0
          ? <div className="empty">
              <div className="empty-icon">{tab === 'all' ? '📭' : '📋'}</div>
              <h4>{tab === 'all' ? 'لا توجد فرص تدريب حالياً' : 'لم تتقدم على أي تدريب بعد'}</h4>
              <p>{tab === 'all'
                ? 'لم يضف أي مدرب فرص تدريب بعد، تحقق لاحقاً'
                : 'استعرض الفرص المتاحة وابدأ التقديم'
              }</p>
            </div>
          : <div className="grid">
              {displayList.map(i => (
                <div key={i.id} className="intern-card">
                  <span className="intern-field">{i.field}</span>
                  <h4>{i.profiles?.company_name || i.profiles?.name || '—'}</h4>
                  {i.description && <p className="intern-desc">{i.description}</p>}
                  <div className="intern-footer">
                    <span>{fmt(i.created_at)}</span>
                    {applied.has(i.id)
                      ? <button
                          className="applied-badge"
                          onClick={() => { setSelected(i); setTrainerInfo(i.profiles); }}
                        >
                          ✅ تقدمت — بيانات المدرب
                        </button>
                      : <button
                          className="btn btn-blue btn-sm"
                          disabled={loading === i.id}
                          onClick={() => handleApply(i)}
                        >
                          {loading === i.id ? <span className="spinner"/> : '📨 قدّم الآن'}
                        </button>
                    }
                  </div>
                </div>
              ))}
            </div>
      }

      {selected && trainerInfo && (
        <TrainerModal
          info={trainerInfo}
          field={selected.field}
          onClose={() => { setSelected(null); setTrainerInfo(null); }}
        />
      )}
    </div>
  );
}

// ─── LOADING STATE ────────────────────────────────────────────────────────────
function Loading() {
  return (
    <div className="empty">
      <div className="empty-icon">⏳</div>
      <h4>جاري التحميل...</h4>
    </div>
  );
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
